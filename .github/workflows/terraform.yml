name: Terraform Feature Branch - Plan

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'Parent-Module'

    steps:

      # =========================================================  #ff
      # STEP 1 - Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # STEP 2 - Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      # =========================================================
      # STEP 3 - Azure Login Using Service Principal
      # =========================================================
      - name: Azure Login Using Service Principal
        run: |
          az login \
            --service-principal \
            --username "50648d8a-5440-4d4a-93bb-8b9a5f14aaca" \
            --password "IXy8Q~r6ElhtnHHuwRs~fiBWk5EpSvS1x4gqEbWu" \
            --tenant "91695fd6-371b-4c10-8dc9-21e31d347ad6"

          az account set \
            --subscription "b299f192-d573-4040-b542-2aff90a974b5"

      # =========================================================
      # STEP 4 - Verify Azure Subscription
      # =========================================================
      - name: Verify Azure Login
        run: az account show --output table


      # =========================================================
      # STEP 5 - Terraform Format Check
      # =========================================================
      - name: Terraform Format Check
        run: terraform fmt -recursive


      # =========================================================
      # STEP 6 - Terraform Init
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false


      # =========================================================
      # STEP 7 - Terraform Validate
      # =========================================================
      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # STEP 8 - Terraform Plan
      # =========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -no-color

        # =========================================================
  # STAGE 2 - TERRAFORM SECURITY & COST SCANNING
  # =========================================================
  terraform-scanning:
    name: Stage 2 - Terraform Security & Cost Scanning
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    steps:

      # =========================================================
      # STEP 1 - Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # STEP 2 - TFLINT
      # =========================================================
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint Init
        working-directory: 'Parent-Module'
        run: tflint --init

      - name: TFLint Scan
        working-directory: 'Parent-Module'
        run: tflint --format compact


      # =========================================================
      # STEP 3 - CHECKOV
      # =========================================================
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Parent-Module
          framework: terraform
          quiet: false
          soft_fail: false


      # =========================================================
      # STEP 4 - TERRASCAN
      # =========================================================
      - name: Install Terrascan
        run: |
          curl -L \
            https://github.com/tenable/terrascan/releases/download/v1.19.9/terrascan_1.19.9_Linux_x86_64.tar.gz \
            -o terrascan.tar.gz

          tar -xzf terrascan.tar.gz

          sudo mv terrascan /usr/local/bin/terrascan

          terrascan version

      - name: Terrascan Scan
        working-directory: 'Parent-Module'
        run: |
          terrascan scan \
            -i terraform \
            -d .


      # =========================================================
      # STEP 5 - GITLEAKS
      # =========================================================
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # STEP 6 - INSTALL INFRACOST
      # =========================================================
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}


      # =========================================================
      # STEP 7 - CHECK INFRACOST API KEY
      # =========================================================
      - name: Verify Infracost API Key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "ERROR: INFRACOST_API_KEY is not configured."
            echo "Please add INFRACOST_API_KEY under:"
            echo "GitHub Repository -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "Infracost API key is configured."


      # =========================================================
      # STEP 8 - INFRACOST SCAN
      # =========================================================
      - name: Infracost Scan
        working-directory: 'Parent-Module'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format table \
            --no-color


      # =========================================================
      # STEP 9 - INFRACOST JSON REPORT
      # =========================================================
      - name: Infracost JSON Report
        working-directory: 'Parent-Module'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json


      # =========================================================
      # STEP 10 - Upload Infracost Report
      # =========================================================
      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          path: Parent-Module/infracost.json