name: Terraform Feature Branch - Plan

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'Project-New/Parent Module'

    steps:

      # =========================================================
      # STEP 1 - Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # STEP 2 - Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      # =========================================================
      # STEP 3 - Azure Login Using Service Principal
      # =========================================================
      - name: Azure Login Using Service Principal
        run: |
          az login \
            --service-principal \
            --username "50648d8a-5440-4d4a-93bb-8b9a5f14aaca" \
            --password "kD48Q~RCsCJklAyGJc_gkuV~_2Qz-.t_ZRh._bMr" \
            --tenant "91695fd6-371b-4c10-8dc9-21e31d347ad6"

          az account set \
            --subscription "b299f192-d573-4040-b542-2aff90a974b5"

      # =========================================================
      # STEP 4 - Verify Azure Subscription
      # =========================================================
      - name: Verify Azure Login
        run: az account show --output table


      # =========================================================
      # STEP 5 - Terraform Format Check
      # =========================================================
      - name: Terraform Format Check
        run: terraform fmt -recursive


      # =========================================================
      # STEP 6 - Terraform Init
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false


      # =========================================================
      # STEP 7 - Terraform Validate
      # =========================================================
      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # STEP 8 - Terraform Plan
      # =========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -no-color